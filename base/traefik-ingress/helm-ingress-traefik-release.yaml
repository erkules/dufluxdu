---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: helm-ingress
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
spec:
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: ingress-treafik
      version: "42.4.2"
  interval: 1m0s
  targetNamespace: ingress
  releaseName: ingress-traefik
  install:
    remediation:
      retries: 7
    createNamespace: true
  upgrade:
    remediation:
      retries: 7
  valuesFrom:
  - kind: ConfigMap
    name: traefik-values
